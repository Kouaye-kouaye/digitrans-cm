spring:
  application:
    name: erp-service
  profiles:
    active: dev

server:
  port: 8081

jwt:
  secret: "digitrans-cm-secret-key-agrocam-2026-camtech-minimum-256bits"
  expiration: 86400000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:erp_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
