version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: digitrans-postgres
    environment:
      POSTGRES_USER: digitrans
      POSTGRES_PASSWORD: digitrans123
      POSTGRES_DB: digitrans
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitrans"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: digitrans-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitrans_gateway
      SPRING_DATASOURCE_USERNAME: digitrans
      SPRING_DATASOURCE_PASSWORD: digitrans123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: "digitrans-cm-secret-key-agrocam-2026-camtech-minimum-256bits"
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  erp-service:
    build:
      context: .
      dockerfile: erp-service/Dockerfile
    container_name: digitrans-erp
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitrans_erp
      SPRING_DATASOURCE_USERNAME: digitrans
      SPRING_DATASOURCE_PASSWORD: digitrans123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: "digitrans-cm-secret-key-agrocam-2026-camtech-minimum-256bits"
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  crm-service:
    build:
      context: .
      dockerfile: crm-service/Dockerfile
    container_name: digitrans-crm
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitrans_crm
      SPRING_DATASOURCE_USERNAME: digitrans
      SPRING_DATASOURCE_PASSWORD: digitrans123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: "digitrans-cm-secret-key-agrocam-2026-camtech-minimum-256bits"
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  supply-chain-service:
    build:
      context: .
      dockerfile: supply-chain-service/Dockerfile
    container_name: digitrans-supply-chain
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digitrans_supply
      SPRING_DATASOURCE_USERNAME: digitrans
      SPRING_DATASOURCE_PASSWORD: digitrans123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: "digitrans-cm-secret-key-agrocam-2026-camtech-minimum-256bits"
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
